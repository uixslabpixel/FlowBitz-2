# Pages CMS (https://app.pagescms.org) — edits commit straight to this repo.
media:
  input: public/images/tools
  output: /images/tools
  extensions: [png, jpg, jpeg, webp, gif, svg]

content:
  - name: tools
    label: Tools
    type: collection
    path: src/app/content/tools
    format: json
    filename: "{primary}.json"
    view:
      primary: name
      fields: [name, tags]
      sort: name
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: cover
        label: Cover
        description: Card image, 4:3 works best.
        type: image
      - name: tags
        label: Tags
        description: Also used as the filter chips on the Tools page.
        type: string
        list: true
      - name: links
        label: Links
        description: The first link is where the card opens.
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
